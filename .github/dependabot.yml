#
# The build shades every dependency into the distributed jar, so an outdated
# dependency becomes a problem for everyone who ships that jar. Let Dependabot
# keep track rather than relying on someone remembering.

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    # bcprov-jdk15on is the legacy artifact line; moving to a current release
    # means changing the artifact ID to bcprov-jdk18on, which Dependabot cannot
    # do on its own. See docs/third-party.md.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
