#
# Nothing here can exercise the card paths — those need a physical reader and a
# card. CI checks that the project builds, that licensing stays intact, and
# that the documentation does not rot.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build the shaded jar
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload the jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v6
        with:
          name: IoT_SAFE_Tool
          path: target/IoT_SAFE_Tool.jar
          if-no-files-found: error

  dependencies:
    name: Dependency report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: What ends up in the jar
        run: mvn --batch-mode --no-transfer-progress dependency:tree

      - name: Available updates
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress versions:display-dependency-updates

  licence-headers:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every source file carries an SPDX identifier
        run: |
          status=0
          for f in $(git ls-files '*.java'); do
            if ! grep -q "SPDX-License-Identifier: Apache-2.0" "$f"; then
              echo "::error file=$f::missing SPDX-License-Identifier header"
              status=1
            fi
            if ! grep -q "Quantag IT Solutions GmbH" "$f"; then
              echo "::error file=$f::missing copyright line"
              status=1
            fi
          done
          exit $status

      - name: LICENSE is the unmodified Apache 2.0 text
        run: |
          expected=3b83ef96387f14655fc854ddc3c6bd57
          actual=$(md5sum LICENSE | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error file=LICENSE::LICENSE differs from the canonical Apache 2.0 text ($actual)"
            exit 1
          fi

      - name: NOTICE names the copyright holder
        run: grep -q "Quantag IT Solutions GmbH" NOTICE

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          files = subprocess.run(["git", "ls-files", "*.md"],
                                 capture_output=True, text=True,
                                 check=True).stdout.split()
          link = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          bad = 0
          for name in files:
              md = pathlib.Path(name)
              for target in link.findall(md.read_text()):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  path = target.split("#", 1)[0]
                  if not path:
                      continue
                  if not (md.parent / path).exists():
                      print(f"::error file={name}::broken relative link: {target}")
                      bad += 1
          sys.exit(1 if bad else 0)
          PY
